name: MoojPay Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MoojPay.sln

      - name: Build (backend.build)
        run: dotnet build MoojPay.sln -c Release --no-restore

      - name: Format check (backend.format-check)
        run: dotnet format --verify-no-changes

      - name: Dependency vulnerability scan (backend.security-dependency-scan)
        run: dotnet list MoojPay.sln package --vulnerable --include-transitive

      # Test-suite checks (unit/integration/isolation/persistence/PCI-boundary) are intentionally
      # absent: the accepted BuildSpec (generation 3) tailors OE-TEST-001 not-applicable, since the
      # accepted technical solution never authorized the tests/MoojPay.UnitTests and
      # tests/MoojPay.IntegrationTests source paths (risk exception rsk_01a08589ae0b77f5a528a1c541b272ff,
      # expires 2026-09-23). Re-add these steps once a follow-up change authorizes those test paths.

  # Container build/push is described by the accepted BuildSpec's rollout plan (Workload Identity
  # Federation to Google Artifact Registry) but is not wired to a real GCP project/pool in this
  # greenfield repository yet. Left as an explicit placeholder rather than a fabricated deploy step.
