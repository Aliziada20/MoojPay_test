  #   steps:
  #     - uses: google-github-actions/auth@v2
  #       with:
  #         workload_identity_provider: <configure-before-enabling>
  #         service_account: <configure-before-enabling>
  #     - run: echo "Configure Artifact Registry push once WIF is provisioned."
